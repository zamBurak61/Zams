name: Widget APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk zams-widget.apk
          VER=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          gh release delete widget --yes --cleanup-tag || true
          gh release create widget zams-widget.apk \
            --title "Zam's Widget $VER" \
            --notes "Zam's Widget $VER. Telefondan indir: zams-widget.apk (derleme ${{ github.run_number }})." \
            --target "${{ github.sha }}"

      - name: Publish build log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 120000 android/build.log > build-log.txt || echo "no log" > build-log.txt
          gh release delete build-log --yes --cleanup-tag || true
          gh release create build-log build-log.txt --prerelease \
            --title "Widget build log" --notes "Derleme ${{ github.run_number }} başarısız." \
            --target "${{ github.sha }}"
