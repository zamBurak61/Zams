plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'com.zamburak.zams'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zamburak.zams.widget'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.2.0"
    }

    signingConfigs {
        release {
            storeFile file('zams.keystore')
            storePassword 'zamswidget'
            keyAlias 'zams'
            keyPassword 'zamswidget'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
